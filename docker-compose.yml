services:
 backend:
  build:
   context: ./backend
   dockerfile: Dockerfile
  container_name: cogniFlow-backend
  env_file:
   - backend/.env
  ports:
   - "8080:8080"
  depends_on:
   - postgres
  restart: always
  volumes:
   - ./backend:/app
   - /app/venv

 frontend:
  build:
   context: ./frontend
   dockerfile: Dockerfile
  container_name: cogniFlow-frontend
  env_file:
   - frontend/.env
  ports:
   - "3000:5173"
  restart: always
  volumes:
   - ./frontend:/app
   - /app/node_modules

 postgres:
  image: postgres:15
  container_name: cogniFlow-postgres
  environment:
   POSTGRES_USER: postgres
   POSTGRES_PASSWORD: postgres
   POSTGRES_DB: cogniflow
  ports:
   - "5432:5432"
  volumes:
   - postgres_data:/var/lib/postgresql/data
  restart: always

volumes:
 postgres_data:
