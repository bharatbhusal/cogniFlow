services:
 backend:
  build:
   context: ./backend
   dockerfile: Dockerfile
  container_name: cogniFlow-backend
  env_file:
   - backend/.env
  ports:
   - "8080:8080"
  depends_on:
   - postgres
   - chromadb
  restart: always
  volumes:
   - ./backend:/app
   - /app/venv

 frontend:
  build:
   context: ./frontend
   dockerfile: Dockerfile
  container_name: cogniFlow-frontend
  env_file:
   - frontend/.env
  ports:
   - "3000:5173"
  restart: always
  volumes:
   - ./frontend:/app
   - /app/node_modules

 postgres:
  image: postgres:15
  container_name: cogniFlow-postgres
  environment:
   POSTGRES_USER: postgres
   POSTGRES_PASSWORD: postgres
   POSTGRES_DB: cogniflow
  ports:
   - "5432:5432"
  volumes:
   - postgres_data:/var/lib/postgresql/data
  restart: always

 chromadb:
  image: chromadb/chroma:1.0.22.dev23
  container_name: cogniFlow-chromadb
  ports:
   - "8000:8000"
  environment:
   # Persist to volume, disable anonymous telemetry for production
   - IS_PERSISTENT=TRUE
   - PERSIST_DIRECTORY=/chroma
   - ANONYMIZED_TELEMETRY=False
  volumes:
   - chroma_data:/chroma
  restart: unless-stopped
  healthcheck:
   test:
    [
     "CMD",
     "curl",
     "-f",
     "http://localhost:8000/api/v1/heartbeat",
    ]
   interval: 20s
   timeout: 5s
   retries: 5

volumes:
 postgres_data:
 chroma_data:
