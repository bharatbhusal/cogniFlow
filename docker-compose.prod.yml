# Production Docker Compose Configuration for AWS EC2
# This file is optimized for production deployment

services:
 backend:
  image: ${BACKEND_IMAGE}
  container_name: cogniFlow-backend
  env_file:
   - .env.backend.production
  ports:
   - "8080:8080"
  depends_on:
   - postgres
   - chromadb
  restart: unless-stopped
  healthcheck:
   test:
    [
     "CMD",
     "curl",
     "-f",
     "http://localhost:8080/api/open/health",
    ]
   interval: 30s
   timeout: 10s
   retries: 3

 postgres:
  image: postgres:15
  container_name: cogniFlow-postgres
  ports:
   - "5432:5432"
  environment:
   POSTGRES_USER: postgres
   POSTGRES_PASSWORD: postgres
   POSTGRES_DB: cogniflow
  volumes:
   - postgres_data:/var/lib/postgresql/data
   - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
  restart: unless-stopped
  healthcheck:
   test: ["CMD-SHELL", "pg_isready -U postgres"]
   interval: 10s
   timeout: 5s
   retries: 5

  chromadb:
   image: chromadb/chroma:1.0.22.dev23
   container_name: cogniFlow-chromadb
   ports:
    - "8000:8000"
   environment:
    # Persist to volume, disable anonymous telemetry for production
    - IS_PERSISTENT=TRUE
    - PERSIST_DIRECTORY=/chroma
    - ANONYMIZED_TELEMETRY=False
   volumes:
    - chroma_data:/chroma
   restart: unless-stopped
   healthcheck:
    test:
     [
      "CMD",
      "curl",
      "-f",
      "http://localhost:8000/api/v1/heartbeat",
     ]
    interval: 20s
    timeout: 5s
    retries: 5

volumes:
 postgres_data:
 chroma_data:
