# Production Docker Compose Configuration for AWS EC2
# This file is optimized for production deployment

services:
 backend:
  image: ${BACKEND_IMAGE}
  container_name: cogniFlow-backend
  env_file:
   - .env.backend.production
  ports:
   - "8080:8080"
  depends_on:
   - postgres
  restart: unless-stopped
  healthcheck:
   test:
    [
     "CMD",
     "curl",
     "-f",
     "http://localhost:8080/api/open/health",
    ]
   interval: 30s
   timeout: 10s
   retries: 3

 postgres:
  image: postgres:15
  container_name: cogniFlow-postgres
  ports:
   - "5432:5432"
  environment:
   POSTGRES_USER: postgres
   POSTGRES_PASSWORD: postgres
   POSTGRES_DB: cogniflow
  volumes:
   - postgres_data:/var/lib/postgresql/data
   - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
  restart: unless-stopped
  healthcheck:
   test: ["CMD-SHELL", "pg_isready -U postgres"]
   interval: 10s
   timeout: 5s
   retries: 5

volumes:
 postgres_data:
